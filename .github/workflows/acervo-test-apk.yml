name: CineHUB TV 1.3.6 Catalog and Details Test APK

on:
  push:
    branches:
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinehub-tv-acervo-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build isolated debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify test package and version
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          test -x "$APKANALYZER"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          test "$APP_ID" = "br.com.cinehub.tv.test" || { echo "::error::Unexpected test applicationId: $APP_ID"; exit 1; }
          test "$VERSION_CODE" = "136" || { echo "::error::Unexpected test versionCode: $VERSION_CODE"; exit 1; }
          test "$VERSION_NAME" = "1.3.6-visual-catalog-test-debug" || { echo "::error::Unexpected test versionName: $VERSION_NAME"; exit 1; }
          cp "$APK" "CineHUB-TV-1.3.6-CATALOG-DETAILS-TEST.apk"
          sha256sum "CineHUB-TV-1.3.6-CATALOG-DETAILS-TEST.apk" | tee "CineHUB-TV-1.3.6-CATALOG-DETAILS-TEST.sha256"
          echo "Verified isolated test package $APP_ID ($VERSION_NAME, code $VERSION_CODE). No release or OTA manifest is published."

      - name: Upload APK test artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineHUB-TV-1.3.6-CATALOG-DETAILS-TEST
          path: |
            CineHUB-TV-1.3.6-CATALOG-DETAILS-TEST.apk
            CineHUB-TV-1.3.6-CATALOG-DETAILS-TEST.sha256
          if-no-files-found: error
          retention-days: 14
