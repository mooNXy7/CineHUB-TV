name: Legacy CineHUB TV 1.2.9 Release — Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent publishing the legacy WebView build
        run: |
          echo "This legacy 1.2.9 workflow is intentionally disabled."
          echo "It must not publish or overwrite the official Kotlin TV build."
          echo "Restore a release workflow only after the intended Kotlin 0.2.x source and version are present in this repository."
