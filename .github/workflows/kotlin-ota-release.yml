name: CineHUB TV Kotlin — Signed OTA Release

on:
  push:
    branches:
      - release/kotlin-ota-v1.3.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinehub-kotlin-ota-release
  cancel-in-progress: true

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kotlin release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode and validate signing key
        env:
          CINEHUB_TV_KEYSTORE_BASE64: ${{ secrets.CINEHUB_TV_KEYSTORE_BASE64 }}
          CINEHUB_TV_KEYSTORE_PASSWORD: ${{ secrets.CINEHUB_TV_KEYSTORE_PASSWORD }}
          CINEHUB_TV_KEY_ALIAS: ${{ secrets.CINEHUB_TV_KEY_ALIAS }}
          CINEHUB_TV_KEY_PASSWORD: ${{ secrets.CINEHUB_TV_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CINEHUB_TV_KEYSTORE_BASE64" || { echo "::error::Secret CINEHUB_TV_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$CINEHUB_TV_KEYSTORE_PASSWORD" || { echo "::error::Secret CINEHUB_TV_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$CINEHUB_TV_KEY_ALIAS" || { echo "::error::Secret CINEHUB_TV_KEY_ALIAS is missing"; exit 1; }
          test -n "$CINEHUB_TV_KEY_PASSWORD" || { echo "::error::Secret CINEHUB_TV_KEY_PASSWORD is missing"; exit 1; }
          printf '%s' "$CINEHUB_TV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinehub-tv-release.jks"
          test -s "$RUNNER_TEMP/cinehub-tv-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/cinehub-tv-release.jks" -storepass "$CINEHUB_TV_KEYSTORE_PASSWORD" -alias "$CINEHUB_TV_KEY_ALIAS" >/dev/null
          echo "CINEHUB_TV_KEYSTORE_PATH=$RUNNER_TEMP/cinehub-tv-release.jks" >> "$GITHUB_ENV"

      - name: Build Kotlin release APK
        env:
          CINEHUB_TV_KEYSTORE_PATH: ${{ runner.temp }}/cinehub-tv-release.jks
          CINEHUB_TV_KEYSTORE_PASSWORD: ${{ secrets.CINEHUB_TV_KEYSTORE_PASSWORD }}
          CINEHUB_TV_KEY_ALIAS: ${{ secrets.CINEHUB_TV_KEY_ALIAS }}
          CINEHUB_TV_KEY_PASSWORD: ${{ secrets.CINEHUB_TV_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify package, version and APK signature
        id: verify
        env:
          CINEHUB_TV_KEYSTORE_PATH: ${{ runner.temp }}/cinehub-tv-release.jks
          CINEHUB_TV_KEYSTORE_PASSWORD: ${{ secrets.CINEHUB_TV_KEYSTORE_PASSWORD }}
          CINEHUB_TV_KEY_ALIAS: ${{ secrets.CINEHUB_TV_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -x "$APKSIGNER"
          test -x "$APKANALYZER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          EXPECTED_CERT="$(keytool -exportcert -keystore "$CINEHUB_TV_KEYSTORE_PATH" -storepass "$CINEHUB_TV_KEYSTORE_PASSWORD" -alias "$CINEHUB_TV_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f]+)$/\1/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test "$APP_ID" = "br.com.cinehub.tv" || { echo "::error::Unexpected applicationId: $APP_ID"; exit 1; }
          test "$VERSION_CODE" -ge 130 || { echo "::error::versionCode must be at least 130"; exit 1; }
          test -n "$VERSION_NAME"
          test -n "$EXPECTED_CERT"
          test "$EXPECTED_CERT" = "$ACTUAL_CERT" || { echo "::error::APK certificate does not match the supplied release keystore"; exit 1; }
          APK_NAME="CineHUB-TV-Kotlin-v${VERSION_NAME}.apk"
          cp "$APK" "$APK_NAME"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "release_tag=kotlin-v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Verified applicationId=$APP_ID versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Publish Kotlin preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: CineHUB TV Kotlin v${{ steps.verify.outputs.version_name }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.verify.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Kotlin OTA manifest on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          APK_NAME: ${{ steps.verify.outputs.apk_name }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
          RELEASE_TAG: ${{ steps.verify.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/update-kotlin.json" <<EOF
          {
            "app": "CineHUB TV Kotlin",
            "version": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "releaseUrl": "https://github.com/mooNXy7/CineHUB-TV/releases/tag/$RELEASE_TAG",
            "apkUrl": "https://github.com/mooNXy7/CineHUB-TV/releases/download/$RELEASE_TAG/$APK_NAME",
            "sha256": "$SHA256",
            "channel": "kotlin-preview"
          }
          EOF
          CONTENT="$(base64 -w 0 "$RUNNER_TEMP/update-kotlin.json")"
          API_PATH="repos/mooNXy7/CineHUB-TV/contents/update-kotlin.json"
          if MANIFEST_SHA="$(gh api "$API_PATH?ref=main" --jq .sha 2>/dev/null)"; then
            gh api --method PUT "$API_PATH" -f message="chore(ota): publish Kotlin v$VERSION_NAME update manifest" -f content="$CONTENT" -f sha="$MANIFEST_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message="chore(ota): add Kotlin v$VERSION_NAME update manifest" -f content="$CONTENT" -f branch=main >/dev/null
          fi
          echo "Kotlin OTA manifest updated on main for v$VERSION_NAME."
