name: CineHUB TV Kotlin PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinehub-tv-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-kotlin-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compile Kotlin debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify isolated debug package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          test -x "$APKANALYZER"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          test "$APP_ID" = "br.com.cinehub.tv.test" || { echo "::error::Unexpected debug applicationId: $APP_ID"; exit 1; }
          test "$VERSION_CODE" = "133" || { echo "::error::Unexpected debug versionCode: $VERSION_CODE"; exit 1; }
          test "$VERSION_NAME" = "1.3.3-player-test" || { echo "::error::Unexpected debug versionName: $VERSION_NAME"; exit 1; }
          echo "Validated Kotlin debug APK metadata: $APP_ID $VERSION_NAME ($VERSION_CODE)."
